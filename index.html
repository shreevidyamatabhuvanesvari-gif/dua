<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#110d1b" />
    <meta name="color-scheme" content="dark" />

    <meta
      name="description"
      content="श्रुति — संस्कृत और हिंदी पाठ, वैदिक वाचन, वीडियो प्लेयर तथा पाठ-अभ्यास के लिए स्टूडियो।"
    />

    <meta name="application-name" content="श्रुति" />

    <title>अंजली अवस्थी | श्रुति वैदिक वीडियो स्टूडियो</title>

    <style>
      :root {
        font-family:
          "Noto Sans Devanagari",
          "Nirmala UI",
          "Mangal",
          system-ui,
          sans-serif;
        color: #fff4df;
        background: #110d1b;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .app-startup {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            ellipse at top,
            rgba(168, 102, 45, 0.22),
            transparent 55%
          ),
          #110d1b;
      }

      .app-startup__card {
        width: min(100%, 560px);
        padding: 32px 24px;
        border: 1px solid rgba(233, 196, 110, 0.45);
        border-radius: 22px;
        background: #191326;
        text-align: center;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
      }

      .app-startup__symbol {
        margin: 0 0 12px;
        color: #f2ce7a;
        font-size: 42px;
      }

      .app-startup__title {
        margin: 0;
        color: #f5d587;
        font-size: clamp(32px, 8vw, 46px);
      }

      .app-startup__subtitle {
        margin: 10px 0 20px;
        color: #e7d5bb;
        line-height: 1.8;
      }

      .app-startup__status {
        color: #c8bbd5;
        font-size: 14px;
        line-height: 1.8;
      }

      .app-startup__retry {
        min-height: 44px;
        margin-top: 16px;
        padding: 10px 22px;
        border: 1px solid #e8c46e;
        border-radius: 10px;
        background: #e8c46e;
        color: #21172b;
        font-weight: 700;
      }

      .app-startup__retry:focus-visible {
        outline: 3px solid #fff0bf;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="app-startup" aria-live="polite" aria-busy="true">
        <section class="app-startup__card">
          <p class="app-startup__symbol" aria-hidden="true">ॐ</p>

          <h1 class="app-startup__title">श्रुति</h1>

          <p class="app-startup__subtitle">
            अंजली अवस्थी<br />
            वैदिक पाठ एवं वीडियो स्टूडियो
          </p>

          <p class="app-startup__status">
            स्टूडियो लोड हो रहा है…
          </p>

          <button
            class="app-startup__retry"
            type="button"
            onclick="window.location.reload()"
          >
            पुनः प्रयास करें
          </button>
        </section>
      </main>
    </div>

    <noscript>
      <main
        style="
          padding: 24px;
          background: #110d1b;
          color: #fff4df;
          text-align: center;
          line-height: 1.8;
        "
      >
        श्रुति स्टूडियो चलाने के लिए ब्राउज़र में JavaScript चालू होना चाहिए।
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
